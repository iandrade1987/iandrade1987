<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="iandrade@cybersec:~$ whoami -- Igor Andrade -- Cybersecurity | Python">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="800" height="280" rx="12" ry="12"/>
    </clipPath>

    <pattern id="matrix" width="34" height="34" patternUnits="userSpaceOnUse">
      <text x="1" y="14" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#39ff14" opacity="0.07">10</text>
      <text x="17" y="30" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#39ff14" opacity="0.05">01</text>
    </pattern>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="2" fill="#000000" opacity="0.10"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="800" height="280" fill="#0a0e14"/>
    <rect x="0" y="32" width="800" height="248" fill="url(#matrix)"/>

    <rect x="0" y="0" width="800" height="32" fill="#161b22"/>
    <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="16" r="6" fill="#27c93f"/>
    <text x="400" y="21" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">iandrade@cybersec: ~</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="17">
      <text x="24" y="70" filter="url(#glow)"><tspan fill="#39ff14">iandrade@cybersec:~$ </tspan><tspan fill="#00e5ff">whoami</tspan></text>
      <text x="24" y="98" fill="#8b949e">Igor Andrade</text>

      <text x="24" y="130" filter="url(#glow)"><tspan fill="#39ff14">iandrade@cybersec:~$ </tspan><tspan fill="#00e5ff">cat</tspan><tspan fill="#c9d1d9"> focus.txt</tspan></text>
      <text x="24" y="158" fill="#8b949e">Cybersecurity | Python</text>

      <text x="24" y="190" filter="url(#glow)"><tspan fill="#39ff14">iandrade@cybersec:~$ </tspan><tspan fill="#00e5ff">nmap</tspan><tspan fill="#c9d1d9"> -sV -T4 target</tspan></text>
      <text x="24" y="218" fill="#8b949e">Host is up (0.002s latency). 3 ports open.</text>

      <text x="24" y="250" filter="url(#glow)"><tspan fill="#39ff14">iandrade@cybersec:~$ </tspan><tspan id="cursor" fill="#39ff14">&#9611;</tspan></text>
    </g>

    <rect x="0" y="0" width="800" height="280" fill="url(#scanlines)"/>
  </g>

  <rect x="0.75" y="0.75" width="798.5" height="278.5" rx="12" ry="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <animate xlink:href="#cursor" attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
</svg>
