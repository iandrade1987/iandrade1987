<svg width="800" height="210" viewBox="0 0 800 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="iandrade@cybersec:~$ whoami -- Igor Andrade -- Cybersecurity | Python">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="800" height="210" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="800" height="210" fill="#0d1117"/>
    <rect x="0" y="0" width="800" height="32" fill="#161b22"/>
    <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="16" r="6" fill="#27c93f"/>
    <text x="400" y="21" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">iandrade@cybersec: ~</text>
  </g>

  <rect x="0.75" y="0.75" width="798.5" height="208.5" rx="12" ry="12" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <g font-family="Consolas, 'Courier New', monospace" font-size="17">
    <text x="24" y="70" fill="#39ff14">iandrade@cybersec:~$ <tspan fill="#c9d1d9">whoami</tspan></text>
    <text x="24" y="98" fill="#c9d1d9">Igor Andrade</text>

    <text x="24" y="130" fill="#39ff14">iandrade@cybersec:~$ <tspan fill="#c9d1d9">cat focus.txt</tspan></text>
    <text x="24" y="158" fill="#c9d1d9">Cybersecurity | Python</text>

    <text x="24" y="190" fill="#39ff14">iandrade@cybersec:~$ <tspan id="cursor" fill="#39ff14">&#9611;</tspan></text>
